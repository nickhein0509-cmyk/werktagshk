name: WerkTag
options:
  bundleIdPrefix: com.werktag
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  WerkTag:
    type: application
    platform: iOS
    sources:
      - WerkTag
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.werktag.assistant
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: WerkTag.entitlements
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: true
      testTargets:
        - WerkTagUITests
  WerkTagUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: WerkTag
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.werktag.assistant.uitests
        GENERATE_INFOPLIST_FILE: YES
