name: App prüfen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm ci
      - name: Supabase-Edge-Importgraph prüfen
        run: deno check supabase/functions/ai/index.ts supabase/functions/assistance/index.ts supabase/functions/health-sync/index.ts
      - name: Vorhandenen Browser nutzen oder Chromium installieren
        shell: bash
        run: |
          task_chromium="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$task_chromium" ]; then
            printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$task_chromium" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Kontextprüfungen testen
        run: node --test scripts/test-context-guards.mjs
      - name: Produktindex prüfen und bei Abweichung korrigieren
        id: context_index
        run: |
          if ! node scripts/context-index.mjs --check; then
            node scripts/context-index.mjs --write
            echo "Korrigierter Index wird als Artefakt bereitgestellt; keine automatischen Commits."
            exit 1
          fi
      - name: Korrigierten Produktindex bereitstellen
        if: failure() && steps.context_index.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: corrected-product-index
          path: docs/generated-product-index.md
          retention-days: 7
      - run: npm run check
        env:
          # Include the real client dependency graph without production credentials.
          VITE_SUPABASE_URL: https://test-werktag.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_fixture
      - name: Safari-Engine für die Handyprüfung vorbereiten
        run: npx playwright install --with-deps webkit
      - name: Handyabläufe mit Safari-Engine prüfen
        run: npx playwright test --config playwright.assistant-webkit.config.ts
      - name: Synthetische Assistentenansichten für die Oberflächenprüfung
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-ui-synthetic
          path: test-results/assistant-ui/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Synthetisches Lerncockpit für die Oberflächenprüfung
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-ui-synthetic
          path: test-results/cockpit-ui/*.png
          if-no-files-found: ignore
          retention-days: 3
