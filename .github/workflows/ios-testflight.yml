name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Geprüfter iOS-Release-Tag auf main (z. B. ios-v0.2.0)'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    environment: TestFlight
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
    steps:
      - name: Verify distribution prerequisites without exposing values
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Run this workflow from main.'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^ios-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag.'; exit 1; }
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_APP_STORE_PROFILE_BASE64 ASC_PRIVATE_KEY_P8; do
            if [ -z "${!name}" ]; then echo "Missing GitHub TestFlight configuration: $name"; missing=1; fi
          done
          [ "$missing" -eq 0 ]
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$ASC_ISSUER_ID" =~ ^[a-fA-F0-9-]{36}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Require merged source and successful platform and iOS checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          task_sha=$(git rev-parse HEAD)
          [ "$task_sha" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]
          git merge-base --is-ancestor "$task_sha" origin/main
          for workflow in check.yml ios.yml; do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" -f head_sha="$task_sha" -f status=success --jq '.workflow_runs | any(.head_branch == "main" and .event == "push")' | grep -qx true
          done
          printf 'RELEASE_SHA=%s\n' "$task_sha" >> "$GITHUB_ENV"
      - name: Verify published native gateway is available
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://werk-tag.com/api/assistenz-native?action=config' -o "$RUNNER_TEMP/native-config.json"
          status=$(curl --silent --show-error --max-time 30 -H 'Authorization: Bearer invalid.release.probe' -o "$RUNNER_TEMP/native-status.json" -w '%{http_code}' 'https://werk-tag.com/api/assistenz-native?action=status')
          [ "$status" = 401 ] || { echo 'Native backend is not available. Deploy it before TestFlight.'; exit 1; }
          python3 -c 'import json,os; p=os.environ["RUNNER_TEMP"]; assert json.load(open(p+"/native-config.json"))["schemaVersion"] == 1; assert json.load(open(p+"/native-status.json"))["error"] == "Anmeldung erforderlich."'
      - name: Install signing material in temporary runner storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          task_signing="$RUNNER_TEMP/werktag-signing"
          mkdir -p "$task_signing/private_keys"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$task_signing/distribution.p12"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 --decode > "$task_signing/profile.mobileprovision"
          printf '%s' "$ASC_PRIVATE_KEY_P8" > "$task_signing/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          security cms -D -i "$task_signing/profile.mobileprovision" > "$task_signing/profile.plist"
          python3 ios/ci/validate-profile.py "$task_signing/profile.plist" "$APPLE_TEAM_ID" com.werktag.assistant
          task_password=$(openssl rand -hex 32)
          echo "::add-mask::$task_password"
          security create-keychain -p "$task_password" "$task_signing/build.keychain-db"
          security set-keychain-settings -lut 21600 "$task_signing/build.keychain-db"
          security unlock-keychain -p "$task_password" "$task_signing/build.keychain-db"
          security import "$task_signing/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$task_signing/build.keychain-db" >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$task_password" "$task_signing/build.keychain-db" >/dev/null
          security list-keychains -d user -s "$task_signing/build.keychain-db"
          task_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$task_signing/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$task_signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$task_uuid.mobileprovision"
          printf 'PROFILE_UUID=%s\n' "$task_uuid" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, plistlib
          root=os.environ['RUNNER_TEMP']+'/werktag-signing'
          profile=plistlib.load(open(root+'/profile.plist','rb'))
          options={'method':'app-store-connect','destination':'export','teamID':os.environ['APPLE_TEAM_ID'],'signingStyle':'manual','signingCertificate':'Apple Distribution','provisioningProfiles':{'com.werktag.assistant':profile['UUID']},'manageAppVersionAndBuildNumber':False,'uploadSymbols':True}
          with open(root+'/ExportOptions.plist','wb') as out: plistlib.dump(options,out)
          PY
      - name: Archive and export signed iPhone app
        working-directory: ios
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          task_version=$(python3 -c 'import re; print(re.fullmatch(r"ios-v(\d+\.\d+\.\d+)", __import__("os").environ["RELEASE_TAG"]).group(1))')
          task_build="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          xcodebuild -project WerkTag.xcodeproj -scheme WerkTag -configuration Release -destination 'generic/platform=iOS' -archivePath build/WerkTag.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" MARKETING_VERSION="$task_version" CURRENT_PROJECT_VERSION="$task_build" archive
          xcodebuild -exportArchive -archivePath build/WerkTag.xcarchive -exportPath build/export -exportOptionsPlist "$RUNNER_TEMP/werktag-signing/ExportOptions.plist"
          printf 'Source: %s\nVersion: %s\nBuild: %s\n' "$RELEASE_SHA" "$task_version" "$task_build" > build/export/provenance.txt
      - name: Upload signed build to App Store Connect
        run: |
          set -euo pipefail
          task_ipa="$GITHUB_WORKSPACE/ios/build/export/WerkTag.ipa"
          test -s "$task_ipa"
          cd "$RUNNER_TEMP/werktag-signing"
          xcrun altool --upload-app --type ios --file "$task_ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          printf '%s\n' 'Upload accepted. Apple processing and assignment to the internal TestFlight group must still be verified in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: werktag-ios-signed
          path: |
            ios/build/export/*.ipa
            ios/build/export/provenance.txt
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/werktag-signing/build.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/werktag-signing/build.keychain-db" || true; fi
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
          rm -rf "$RUNNER_TEMP/werktag-signing"
